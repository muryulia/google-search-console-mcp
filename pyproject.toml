[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gsc-readonly-mcp"
version = "0.2.0"
description = "A security-focused, read-only MCP server for Google Search Console data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuliya Murtazina" }]
keywords = ["google-search-console", "mcp", "seo", "search-analytics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "google-auth>=2.57,<3",
  "mcp>=2.1.1,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "tomli>=2.2,<3; python_version < '3.11'",
]

[project.scripts]
gsc-mcp = "gsc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/muryulia/google-search-console-mcp"
Repository = "https://github.com/muryulia/google-search-console-mcp"
Issues = "https://github.com/muryulia/google-search-console-mcp/issues"
Security = "https://github.com/muryulia/google-search-console-mcp/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/gsc_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
